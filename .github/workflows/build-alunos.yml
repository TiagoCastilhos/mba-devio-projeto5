name: Build Alunos API

permissions:
  contents: write
  pull-requests: write
  actions: read
  packages: read
  security-events: write
  statuses: write
  checks: write

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-alunos.yml'
      - '.github/workflows/build-base.yml'
      - 'Coldmart.sln'
      - 'src/Coldmart.Alunos.API/**'
      - 'src/Coldmart.Alunos.Business/**'
      - 'src/Coldmart.Alunos.Data/**'
      - 'src/Coldmart.Alunos.Domain/**'
      - 'src/Coldmart.Auth.Data/**'
      - 'src/Coldmart.Core/**'
      - 'src/Coldmart.Core.Data/**'
      - 'tests/Coldmart.Alunos.Business.Tests/**'
      - 'tests/Coldmart.Alunos.Domain.Tests/**'
      - 'tests/Coldmart.Core.Tests/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-alunos.yml'
      - '.github/workflows/build-base.yml'
      - 'Coldmart.sln'
      - 'src/Coldmart.Alunos.API/**'
      - 'src/Coldmart.Alunos.Business/**'
      - 'src/Coldmart.Alunos.Data/**'
      - 'src/Coldmart.Alunos.Domain/**'
      - 'src/Coldmart.Auth.Data/**'
      - 'src/Coldmart.Core/**'
      - 'src/Coldmart.Core.Data/**'
      - 'tests/Coldmart.Alunos.Business.Tests/**'
      - 'tests/Coldmart.Alunos.Domain.Tests/**'
      - 'tests/Coldmart.Core.Tests/**'
  workflow_dispatch:

jobs:
  call-reusable:
    uses: ./.github/workflows/build-base.yml
    with:
      project: "Alunos.API"
      image: "alunos"
    secrets: inherit
